[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]
exclude = ["alembic/", ".venv/"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN", "S"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''/(alembic|\.venv)/'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v"
markers = [
    "integration: tests requiring live external services/credentials",
    "slow: long-running test scenarios",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/templates/*", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
