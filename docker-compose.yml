version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://argo:argo_dev_password@db:5432/argo
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ARGO_BACKEND_URL=http://app:8000
      - BRIDGE_SECRET=${WHATSAPP_BRIDGE_SECRET}
      - BRIDGE_PORT=3001
    ports:
      - "3001:3001"
    volumes:
      - wa_auth:/bridge/.wwebjs_auth
      - wa_cache:/bridge/.wwebjs_cache
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: argo
      POSTGRES_USER: argo
      POSTGRES_PASSWORD: argo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argo -d argo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
  wa_auth:
  wa_cache:
